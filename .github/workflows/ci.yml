name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-make:
    name: Build (Make)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            xvfb

      - name: Build with Make
        run: make

  build-cmake:
    name: Build (CMake)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build with CMake
        run: cmake --build build

      - name: Run tests (CMake)
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  coverage-linux:
    name: Coverage (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            lcov \
            xvfb

      - name: Configure CMake (Coverage)
        run: cmake -S . -B build-coverage -DENABLE_COVERAGE=ON

      - name: Build (Coverage)
        run: cmake --build build-coverage

      - name: Run line coverage
        run: cmake --build build-coverage --target coverage

      - name: Export coverage summary
        run: |
          lcov --summary build-coverage/coverage.info | tee build-coverage/coverage-summary.txt
          {
            echo "## Coverage Summary"
            echo
            echo "\`\`\`text"
            cat build-coverage/coverage-summary.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            build-coverage/coverage.info
            build-coverage/coverage-summary.txt
            build-coverage/coverage-html/

  build-windows-cmake:
    name: Build (Windows CMake)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3

      - name: Configure CMake (Windows)
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles"

      - name: Build with CMake (Windows)
        shell: msys2 {0}
        run: cmake --build build

      - name: Run tests (Windows CMake)
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

  build-windows-make:
    name: Build (Windows Make)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3

      - name: Build with Make (Windows)
        shell: msys2 {0}
        env:
          OS: Windows_NT
        run: mingw32-make
