name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-make:
    name: Build (Make)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Build with Make
        run: make

  build-cmake:
    name: Build (CMake)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build with CMake
        run: cmake --build build

  build-windows-cmake:
    name: Build (Windows CMake)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3

      - name: Configure CMake (Windows)
        shell: msys2 {0}
        run: cmake -S . -B build -G "MinGW Makefiles"

      - name: Build with CMake (Windows)
        shell: msys2 {0}
        run: cmake --build build
