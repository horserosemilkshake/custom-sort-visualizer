name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libglib2.0-dev \
            curl \
            file \
            libfuse2

      - name: Build AppImage
        run: bash scripts/release/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: sort-visualizer-linux-appimage
          path: dist/*.AppImage

  windows-exe:
    name: Windows EXE Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-ntldd

      - name: Build Windows bundle
        shell: msys2 {0}
        run: bash scripts/release/build_windows_bundle_msys2.sh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: sort-visualizer-windows-exe
          path: dist/windows/*

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux-appimage
      - windows-exe
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: sort-visualizer-linux-appimage
          path: release-assets/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: sort-visualizer-windows-exe
          path: release-assets/windows

      - name: Zip Windows bundle
        run: |
          cd release-assets/windows
          zip -r ../../sort-visualizer-windows-x86_64.zip .

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v1.0.0
          name: v1.0.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          files: |
            release-assets/linux/*.AppImage
            sort-visualizer-windows-x86_64.zip
